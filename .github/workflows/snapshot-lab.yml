name: Disposable PR snapshot experiment
on:
  workflow_dispatch:
    inputs:
      action:
        description: Select the check or merge job
        required: true
        type: choice
        options: [attest, request]
      cases:
        description: Synthetic fixture snapshots
        required: true
        type: string
permissions: {}
jobs:
  attest:
    if: github.ref == 'refs/heads/main' && inputs.action == 'attest'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check and attest
        env:
          GH_APP_TOKEN: ${{ github.token }}
          LAB_CASES: ${{ inputs.cases }}
        run: python3 .github/snapshot-lab.py attest
  request:
    if: github.ref == 'refs/heads/main' && inputs.action == 'request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Request the GitHub merge
        env:
          GH_APP_TOKEN: ${{ github.token }}
          LAB_CASES: ${{ inputs.cases }}
        run: python3 .github/snapshot-lab.py request
